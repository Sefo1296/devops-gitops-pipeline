apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-flask-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-flask

  template:
    metadata:
      labels:
        app: devops-flask

    spec:
      containers:
      - name: devops-flask-container
        image: sefo1296/devops-gitops-app:v1

        ports:
        - containerPort: 5000
