apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: flask-app
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/Sefo1296/devops-gitops-pipeline.git
    targetRevision: main
    path: helm/flask-app

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
