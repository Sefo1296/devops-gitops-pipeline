apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: {{ include "flask-app.fullname" . }}-role
  labels:
    {{- include "flask-app.labels" . | nindent 4 }}

rules:

- apiGroups: [""]
  resources:
  - pods
  - services
  - nodes
  verbs:
  - get
  - list

- apiGroups: ["apps"]
  resources:
  - deployments
  verbs:
  - get
  - list


---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: {{ include "flask-app.fullname" . }}-binding
  labels:
    {{- include "flask-app.labels" . | nindent 4 }}


subjects:

- kind: ServiceAccount
  name: {{ include "flask-app.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}


roleRef:

  kind: ClusterRole
  name: {{ include "flask-app.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
